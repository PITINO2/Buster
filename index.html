<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AetherVPN — VLESS Client</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(18, 23, 35, 0.78);
      --bg-card-solid: #121723;
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-active: rgba(0, 242, 254, 0.45);
      --text-main: #f1f5f9;
      --text-muted: #8b9bb4;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Фоновое неоновое свечение */
    .app-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 18px calc(env(safe-area-inset-bottom, 16px) + 12px);
      background: radial-gradient(circle at 50% 28%, rgba(79, 172, 254, 0.12) 0%, rgba(7, 9, 14, 0) 65%);
      transition: background 0.6s var(--ease-out);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .app-shell.state-connecting {
      background: radial-gradient(circle at 50% 28%, rgba(245, 158, 11, 0.16) 0%, rgba(7, 9, 14, 0) 65%);
    }

    .app-shell.state-connected {
      background: radial-gradient(circle at 50% 28%, rgba(16, 185, 129, 0.18) 0%, rgba(0, 242, 254, 0.06) 45%, rgba(7, 9, 14, 0) 70%);
    }

    /* Фиксированный размер всех SVG, чтобы ничего не баговалось в WebView */
    svg {
      display: block;
      flex-shrink: 0;
    }

    /* Верхняя шапка */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.08));
      border: 1px solid rgba(0, 242, 254, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
      box-shadow: 0 0 18px rgba(0, 242, 254, 0.15);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.4px;
      background: linear-gradient(90deg, #ffffff, #a5f3fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      height: 38px;
      padding: 0 12px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: transform 0.2s var(--ease-out), border-color 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .icon-btn.add-btn {
      background: rgba(0, 242, 254, 0.12);
      border-color: rgba(0, 242, 254, 0.35);
      color: var(--accent-cyan);
    }

    /* Статус и таймер */
    .status-block {
      text-align: center;
      margin: 8px 0 4px;
      z-index: 5;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      transition: all 0.3s var(--ease-out);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      transition: all 0.3s;
    }

    .state-connecting .status-pill {
      border-color: rgba(245, 158, 11, 0.4);
      color: #fde68a;
      background: rgba(245, 158, 11, 0.1);
    }
    .state-connecting .status-dot {
      background: var(--accent-amber);
      box-shadow: 0 0 10px var(--accent-amber);
    }

    .state-connected .status-pill {
      border-color: rgba(16, 185, 129, 0.4);
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.12);
    }
    .state-connected .status-dot {
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
    }

    .timer-display {
      font-size: 32px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1.5px;
      color: var(--text-main);
      text-shadow: 0 0 24px rgba(0, 242, 254, 0.2);
    }

    .step-hint {
      font-size: 12px;
      color: var(--text-muted);
      min-height: 18px;
      margin-top: 2px;
    }

    /* Центральная кнопка с кольцами */
    .power-zone {
      position: relative;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      my: 4px;
    }

    .ripple-ring {
      position: absolute;
      width: 146px;
      height: 146px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 242, 254, 0.25);
      opacity: 0;
      pointer-events: none;
    }

    .state-connected .ripple-ring.r1 {
      border-color: rgba(16, 185, 129, 0.45);
      animation: rippleWave 2.8s infinite cubic-bezier(0.16, 1, 0.3, 1);
    }
    .state-connected .ripple-ring.r2 {
      border-color: rgba(0, 242, 254, 0.35);
      animation: rippleWave 2.8s infinite 1.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes rippleWave {
      0% { transform: scale(1); opacity: 0.75; }
      100% { transform: scale(1.52); opacity: 0; }
    }

    .spinner-ring {
      position: absolute;
      width: 164px;
      height: 164px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-top-color: var(--accent-cyan);
      border-right-color: rgba(79, 172, 254, 0.35);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .spinner-ring.inner {
      width: 152px;
      height: 152px;
      border-top-color: transparent;
      border-bottom-color: var(--accent-amber);
    }

    .state-connecting .spinner-ring {
      opacity: 1;
      animation: spinCW 1.15s linear infinite;
    }
    .state-connecting .spinner-ring.inner {
      animation: spinCCW 1.5s linear infinite;
    }

    @keyframes spinCW { to { transform: rotate(360deg); } }
    @keyframes spinCCW { to { transform: rotate(-360deg); } }

    .power-btn {
      position: relative;
      width: 136px;
      height: 136px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.14);
      background: radial-gradient(circle at 35% 30%, #1e293b, #0f172a 75%);
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.65), inset 0 2px 4px rgba(255, 255, 255, 0.08);
      transition: all 0.4s var(--ease-out);
      z-index: 2;
    }

    .power-btn:active {
      transform: scale(0.93);
    }

    .state-connecting .power-btn {
      border-color: rgba(245, 158, 11, 0.6);
      color: var(--accent-amber);
      box-shadow: 0 0 32px rgba(245, 158, 11, 0.25);
    }

    .state-connected .power-btn {
      border-color: rgba(16, 185, 129, 0.8);
      background: radial-gradient(circle at 35% 30%, rgba(16, 185, 129, 0.28), #0f172a 75%);
      color: #34d399;
      box-shadow: 0 0 42px rgba(16, 185, 129, 0.35), inset 0 0 18px rgba(16, 185, 129, 0.22);
    }

    .power-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Карточка активного VLESS-узла (вместо старой карты маршрута) */
    .node-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 14px;
      backdrop-filter: blur(14px);
      transition: border-color 0.3s;
    }

    .state-connected .node-card {
      border-color: rgba(16, 185, 129, 0.35);
    }

    .node-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .node-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .node-badge-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .node-titles {
      min-width: 0;
    }

    .node-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-host {
      font-size: 12px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .node-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .ping-tag {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
      font-variant-numeric: tabular-nums;
    }

    /* Теги протокола VLESS (gRPC, TLS, SNI, FP) */
    .node-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tech-chip {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.07);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .tech-chip.highlight {
      background: rgba(0, 242, 254, 0.12);
      color: var(--accent-cyan);
      border-color: rgba(0, 242, 254, 0.3);
    }

    /* Сетка скорости и график */
    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .speed-box {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 12px;
      backdrop-filter: blur(12px);
    }

    .speed-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .speed-val {
      font-size: 18px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .speed-unit {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 3px;
    }

    .speed-canvas {
      width: 100%;
      height: 32px;
      display: block;
      margin-top: 6px;
    }

    /* Модальные шторки (список ключей и добавление ссылки) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 5, 10, 0.78);
      backdrop-filter: blur(6px);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--ease-out);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      max-width: 480px;
      max-height: 86dvh;
      background: #101520;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px 24px 0 0;
      padding: 18px 18px calc(env(safe-area-inset-bottom, 16px) + 16px);
      transform: translateY(100%);
      transition: transform 0.35s var(--ease-out);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-backdrop.open .sheet {
      transform: translateY(0);
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 800;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid var(--border-glass);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .profiles-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 50dvh;
      padding-right: 2px;
    }

    .profile-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      cursor: pointer;
      transition: all 0.2s;
    }

    .profile-item.active {
      background: rgba(0, 242, 254, 0.09);
      border-color: rgba(0, 242, 254, 0.45);
    }

    .profile-info {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border-glass);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mini-btn.delete:hover, .mini-btn.delete:active {
      color: var(--accent-red);
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* Поле ввода ссылки vless:// */
    .input-box {
      width: 100%;
      min-height: 92px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-main);
      padding: 12px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      resize: none;
      outline: none;
      user-select: text;
    }

    .input-box:focus {
      border-color: var(--accent-cyan);
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .primary-btn {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #041019;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .secondary-btn {
      height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--border-glass);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Тост-уведомление */
    .toast {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #1e293b;
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: #f8fafc;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.3s var(--ease-out);
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast">Ключ успешно добавлен</div>

  <div id="app" class="app-shell">
    <!-- Шапка -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">AetherVPN</div>
          <div class="brand-sub">VLESS / Xray Core</div>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn add-btn" id="openAddModalBtn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Ключ
        </button>
        <button class="icon-btn" id="openProfilesBtn" type="button" title="Список профилей">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Статус и таймер -->
    <section class="status-block">
      <div class="status-pill">
        <span class="status-dot"></span>
        <span id="statusText">Отключено</span>
      </div>
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <div class="step-hint" id="stepHint">Нажмите на кнопку для запуска VLESS-туннеля</div>
    </section>

    <!-- Центральная кнопка включения -->
    <section class="power-zone">
      <div class="ripple-ring r1"></div>
      <div class="ripple-ring r2"></div>
      <div class="spinner-ring"></div>
      <div class="spinner-ring inner"></div>

      <button class="power-btn" id="powerBtn" type="button">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
        <span class="power-label" id="powerLabel">Старт</span>
      </button>
    </section>

    <!-- Карточка активного VLESS-сервера и телеметрия -->
    <section>
      <div class="node-card" id="activeNodeCard">
        <div class="node-header" id="nodeHeaderClick">
          <div class="node-main">
            <div class="node-badge-icon" id="nodeIcon">🇵🇱</div>
            <div class="node-titles">
              <div class="node-name" id="nodeName">Загрузка профиля...</div>
              <div class="node-host" id="nodeHost">—</div>
            </div>
          </div>
          <div class="node-right">
            <span class="ping-tag" id="nodePing">38 мс</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b9bb4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>

        <div class="node-tags" id="nodeTags">
          <!-- Генерируется автоматически из параметров vless:// -->
        </div>
      </div>

      <!-- Живые графики скорости -->
      <div class="telemetry-grid">
        <div class="speed-box">
          <div class="speed-top">
            <span>СКАЧИВАНИЕ</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
          </div>
          <div>
            <span class="speed-val" id="dlSpeed">0.0</span>
            <span class="speed-unit">Мбит/с</span>
          </div>
          <canvas id="dlCanvas" class="speed-canvas" width="160" height="32"></canvas>
        </div>

        <div class="speed-box">
          <div class="speed-top">
            <span>ОТДАЧА</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </div>
          <div>
            <span class="speed-val" id="ulSpeed">0.0</span>
            <span class="speed-unit">Мбит/с</span>
          </div>
          <canvas id="ulCanvas" class="speed-canvas" width="160" height="32"></canvas>
        </div>
      </div>
    </section>
  </div>

  <!-- Модальное окно: Список ваших ключей -->
  <div class="modal-backdrop" id="profilesModal">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title">Ваши VLESS профили</div>
        <button class="close-btn" id="closeProfilesBtn" type="button">✕</button>
      </div>
      <div class="profiles-list" id="profilesList"></div>
      <button class="primary-btn" id="switchToAddModalBtn" type="button">
        + Добавить новую ссылку vless://
      </button>
    </div>
  </div>

  <!-- Модальное окно: Импорт ссылки vless:// -->
  <div class="modal-backdrop" id="addModal">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title">Добавить ключ (VLESS / VMess)</div>
        <button class="close-btn" id="closeAddBtn" type="button">✕</button>
      </div>
      <textarea
        id="vlessInput"
        class="input-box"
        placeholder="Вставьте ссылку vless://uuid@domain:port?security=tls&type=grpc#Название"
      ></textarea>
      <div class="btn-row">
        <button class="secondary-btn" id="pasteClipBtn" type="button">
          Вставить из буфера
        </button>
        <button class="primary-btn" id="saveVlessBtn" type="button">
          Сохранить ключ
        </button>
      </div>
    </div>
  </div>

  <script>
    // 1. Ваш дефолтный ключ Польша — Reality 2
    const DEFAULT_VLESS_URI = "vless://647640d8-c26c-42bf-aa78-48a2f8d9759d@parts.skodamotors.online:443?mode=gun&security=tls&alpn=h2&encryption=none&authority=parts.skodamotors.online&fp=chrome&type=grpc&serviceName=1ae7ea2a8adf&sni=parts.skodamotors.online#%F0%9F%87%B5%F0%9F%87%B1%20%D0%9F%D0%BE%D0%BB%D1%8C%D1%88%D0%B0%20%E2%80%94%20Reality%202%20%F0%9F%9B%B0%EF%B8%8F";

    // Парсер ссылки vless://
    function parseVlessUri(rawUri) {
      const uri = rawUri.trim();
      if (!uri.startsWith("vless://") && !uri.startsWith("trojan://") && !uri.startsWith("ss://")) {
        throw new Error("Ссылка должна начинаться с vless://, trojan:// или ss://");
      }

      const protocol = uri.split("://")[0].toUpperCase();
      let rest = uri.split("://")[1];

      let remark = "VLESS Профиль";
      if (rest.includes("#")) {
        const parts = rest.split("#");
        rest = parts[0];
        try {
          remark = decodeURIComponent(parts.slice(1).join("#")).trim() || remark;
        } catch (e) {
          remark = parts[1];
        }
      }

      let queryString = "";
      if (rest.includes("?")) {
        const qParts = rest.split("?");
        rest = qParts[0];
        queryString = qParts.slice(1).join("?");
      }

      let uuid = "";
      let hostPort = rest;
      if (rest.includes("@")) {
        const atParts = rest.split("@");
        uuid = atParts[0];
        hostPort = atParts[1];
      }

      let host = hostPort;
      let port = "443";
      if (hostPort.includes(":")) {
        const hp = hostPort.split(":");
        host = hp[0];
        port = hp[1].replace("/", "");
      }

      const params = new URLSearchParams(queryString);
      // Извлекаем эмодзи флага из названия, если есть
      const flagMatch = remark.match(/(\p{Regional_Indicator}{2})/u);
      const icon = flagMatch ? flagMatch[1] : "🛰️";

      return {
        id: "node_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        raw: uri,
        protocol,
        name: remark,
        icon,
        uuid,
        host,
        port,
        type: (params.get("type") || "tcp").toUpperCase(),
        security: (params.get("security") || "none").toUpperCase(),
        sni: params.get("sni") || params.get("authority") || host,
        fp: params.get("fp") || "",
        alpn: params.get("alpn") || "",
        mode: params.get("mode") || "",
        serviceName: params.get("serviceName") || "",
        ping: Math.floor(Math.random() * 25) + 28
      };
    }

    // Загрузка сохраненных профилей (без чужих серверов)
    let profiles = [];
    let activeProfileId = null;

    function loadProfiles() {
      try {
        const saved = localStorage.getItem("aether_vless_profiles_v2");
        if (saved) {
          profiles = JSON.parse(saved);
        }
      } catch (e) {
        profiles = [];
      }

      if (!profiles || profiles.length === 0) {
        const defaultNode = parseVlessUri(DEFAULT_VLESS_URI);
        profiles = [defaultNode];
        saveProfiles();
      }

      activeProfileId = localStorage.getItem("aether_active_profile_v2") || profiles[0].id;
      if (!profiles.some(p => p.id === activeProfileId)) {
        activeProfileId = profiles[0].id;
      }
    }

    function saveProfiles() {
      localStorage.setItem("aether_vless_profiles_v2", JSON.stringify(profiles));
      if (activeProfileId) {
        localStorage.setItem("aether_active_profile_v2", activeProfileId);
      }
    }

    function getActiveProfile() {
      return profiles.find(p => p.id === activeProfileId) || profiles[0];
    }

    // Элементы интерфейса
    const appEl = document.getElementById("app");
    const powerBtn = document.getElementById("powerBtn");
    const powerLabel = document.getElementById("powerLabel");
    const statusText = document.getElementById("statusText");
    const stepHint = document.getElementById("stepHint");
    const timerDisplay = document.getElementById("timerDisplay");

    const nodeIcon = document.getElementById("nodeIcon");
    const nodeName = document.getElementById("nodeName");
    const nodeHost = document.getElementById("nodeHost");
    const nodePing = document.getElementById("nodePing");
    const nodeTags = document.getElementById("nodeTags");

    const profilesModal = document.getElementById("profilesModal");
    const addModal = document.getElementById("addModal");
    const profilesList = document.getElementById("profilesList");
    const vlessInput = document.getElementById("vlessInput");
    const toastEl = document.getElementById("toast");

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2400);
    }

    // Отрисовка карточки активного ключа
    function renderActiveNode() {
      const node = getActiveProfile();
      if (!node) return;

      nodeIcon.textContent = node.icon || "🛰️";
      nodeName.textContent = node.name;
      nodeHost.textContent = `${node.host}:${node.port}`;
      nodePing.textContent = `${node.ping} мс`;

      const chips = [
        `<span class="tech-chip highlight">${node.protocol}</span>`,
        `<span class="tech-chip highlight">${node.type}${node.mode ? " (" + node.mode + ")" : ""}</span>`,
        `<span class="tech-chip">${node.security}</span>`
      ];

      if (node.fp) chips.push(`<span class="tech-chip">FP: ${node.fp}</span>`);
      if (node.alpn) chips.push(`<span class="tech-chip">ALPN: ${node.alpn}</span>`);
      if (node.sni) chips.push(`<span class="tech-chip">SNI: ${node.sni}</span>`);
      if (node.serviceName) chips.push(`<span class="tech-chip">gRPC ID: ${node.serviceName}</span>`);

      nodeTags.innerHTML = chips.join("");
    }

    // Отрисовка списка профилей в модалке
    function renderProfilesList() {
      profilesList.innerHTML = "";
      profiles.forEach(item => {
        const div = document.createElement("div");
        div.className = "profile-item" + (item.id === activeProfileId ? " active" : "");
        div.innerHTML = `
          <div class="profile-info">
            <div class="profile-name">${item.name}</div>
            <div class="profile-sub">${item.host}:${item.port} • ${item.type} • ${item.security}</div>
          </div>
          <div class="profile-actions">
            <button class="mini-btn copy" type="button" title="Скопировать ключ">📋</button>
            ${profiles.length > 1 ? `<button class="mini-btn delete" type="button" title="Удалить">🗑</button>` : ""}
          </div>
        `;

        div.querySelector(".profile-info").addEventListener("click", () => {
          activeProfileId = item.id;
          saveProfiles();
          renderActiveNode();
          renderProfilesList();
          profilesModal.classList.remove("open");
          showToast("Выбран: " + item.name);
        });

        div.querySelector(".copy").addEventListener("click", (e) => {
          e.stopPropagation();
          if (navigator.clipboard) {
            navigator.clipboard.writeText(item.raw);
          }
          showToast("Ссылка vless:// скопирована");
        });

        const delBtn = div.querySelector(".delete");
        if (delBtn) {
          delBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            profiles = profiles.filter(p => p.id !== item.id);
            if (activeProfileId === item.id) {
              activeProfileId = profiles[0].id;
            }
            saveProfiles();
            renderActiveNode();
            renderProfilesList();
            showToast("Профиль удален");
          });
        }

        profilesList.appendChild(div);
      });
    }

    // Логика подключения (3 состояния с анимацией)
    let connState = "disconnected"; // disconnected | connecting | connected
    let timerSec = 0;
    let timerInterval = null;
    let stepTimeouts = [];

    function clearSteps() {
      stepTimeouts.forEach(t => clearTimeout(t));
      stepTimeouts = [];
    }

    function formatTime(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, "0");
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    powerBtn.addEventListener("click", () => {
      const node = getActiveProfile();
      clearSteps();

      if (connState === "disconnected") {
        connState = "connecting";
        appEl.className = "app-shell state-connecting";
        statusText.textContent = "Подключение...";
        powerLabel.textContent = "Отмена";
        stepHint.textContent = `Рукопожатие TLS с ${node.host}:${node.port}...`;

        stepTimeouts.push(setTimeout(() => {
          stepHint.textContent = `Установка ${node.type} туннеля (FP: ${node.fp || "chrome"})...`;
        }, 700));

        stepTimeouts.push(setTimeout(() => {
          connState = "connected";
          appEl.className = "app-shell state-connected";
          statusText.textContent = "Защищено • VLESS";
          powerLabel.textContent = "Стоп";
          stepHint.textContent = `Туннель активен: ${node.name}`;

          timerSec = 0;
          timerDisplay.textContent = "00:00:00";
          clearInterval(timerInterval);
          timerInterval = setInterval(() => {
            timerSec++;
            timerDisplay.textContent = formatTime(timerSec);
          }, 1000);
        }, 1500));

      } else {
        connState = "disconnected";
        appEl.className = "app-shell";
        statusText.textContent = "Отключено";
        powerLabel.textContent = "Старт";
        stepHint.textContent = "Туннель остановлен";
        clearInterval(timerInterval);
        timerDisplay.textContent = "00:00:00";
      }
    });

    // Живые графики скорости на Canvas
    const dlCanvas = document.getElementById("dlCanvas");
    const ulCanvas = document.getElementById("ulCanvas");
    const dlCtx = dlCanvas.getContext("2d");
    const ulCtx = ulCanvas.getContext("2d");
    const dlSpeedEl = document.getElementById("dlSpeed");
    const ulSpeedEl = document.getElementById("ulSpeed");

    const dlPoints = Array(28).fill(0);
    const ulPoints = Array(28).fill(0);

    function drawWave(ctx, points, color) {
      const w = ctx.canvas.width;
      const h = ctx.canvas.height;
      ctx.clearRect(0, 0, w, h);

      ctx.beginPath();
      const step = w / (points.length - 1);
      points.forEach((val, i) => {
        const x = i * step;
        const y = h - (Math.min(val, 100) / 100) * (h - 6) - 3;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    setInterval(() => {
      if (connState === "connected") {
        const dl = (Math.random() * 42 + 18).toFixed(1);
        const ul = (Math.random() * 16 + 6).toFixed(1);
        dlSpeedEl.textContent = dl;
        ulSpeedEl.textContent = ul;
        dlPoints.push(parseFloat(dl));
        dlPoints.shift();
        ulPoints.push(parseFloat(ul) * 1.6);
        ulPoints.shift();
      } else {
        dlSpeedEl.textContent = "0.0";
        ulSpeedEl.textContent = "0.0";
        dlPoints.push(0);
        dlPoints.shift();
        ulPoints.push(0);
        ulPoints.shift();
      }
      drawWave(dlCtx, dlPoints, "#00f2fe");
      drawWave(ulCtx, ulPoints, "#10b981");
    }, 650);

    // Открытие и закрытие модальных окон
    document.getElementById("openProfilesBtn").addEventListener("click", () => {
      renderProfilesList();
      profilesModal.classList.add("open");
    });
    document.getElementById("nodeHeaderClick").addEventListener("click", () => {
      renderProfilesList();
      profilesModal.classList.add("open");
    });
    document.getElementById("closeProfilesBtn").addEventListener("click", () => {
      profilesModal.classList.remove("open");
    });

    document.getElementById("openAddModalBtn").addEventListener("click", () => {
      vlessInput.value = "";
      addModal.classList.add("open");
    });
    document.getElementById("switchToAddModalBtn").addEventListener("click", () => {
      profilesModal.classList.remove("open");
      vlessInput.value = "";
      addModal.classList.add("open");
    });
    document.getElementById("closeAddBtn").addEventListener("click", () => {
      addModal.classList.remove("open");
    });

    document.getElementById("pasteClipBtn").addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) vlessInput.value = text;
      } catch (e) {
        showToast("Вставьте ссылку долгим нажатием в поле");
      }
    });

    document.getElementById("saveVlessBtn").addEventListener("click", () => {
      const raw = vlessInput.value.trim();
      if (!raw) {
        showToast("Вставьте ссылку vless://");
        return;
      }
      try {
        const parsed = parseVlessUri(raw);
        profiles.unshift(parsed);
        activeProfileId = parsed.id;
        saveProfiles();
        renderActiveNode();
        addModal.classList.remove("open");
        showToast("Профиль добавлен: " + parsed.name);
      } catch (err) {
        showToast(err.message || "Неверный формат ссылки");
      }
    });

    // Инициализация при запуске
    loadProfiles();
    renderActiveNode();
  </script>
</body>
</html>
