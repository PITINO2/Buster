<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AetherVPN — Xray Core</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(18, 23, 35, 0.82);
      --border-glass: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #8b9bb4;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    svg {
      display: block;
      flex-shrink: 0;
    }

    .app-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 16px) + 10px) 16px calc(env(safe-area-inset-bottom, 16px) + 10px);
      background: radial-gradient(circle at 50% 26%, rgba(79, 172, 254, 0.12) 0%, rgba(7, 9, 14, 0) 65%);
      transition: background 0.5s var(--ease-out);
      overflow-y: auto;
    }

    .app-shell.state-connecting {
      background: radial-gradient(circle at 50% 26%, rgba(245, 158, 11, 0.16) 0%, rgba(7, 9, 14, 0) 65%);
    }

    .app-shell.state-connected {
      background: radial-gradient(circle at 50% 26%, rgba(16, 185, 129, 0.2) 0%, rgba(0, 242, 254, 0.06) 45%, rgba(7, 9, 14, 0) 70%);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.08));
      border: 1px solid rgba(0, 242, 254, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      background: linear-gradient(90deg, #ffffff, #a5f3fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      gap: 7px;
    }

    .icon-btn {
      height: 36px;
      padding: 0 11px;
      border-radius: 11px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .icon-btn.add-btn {
      background: rgba(0, 242, 254, 0.12);
      border-color: rgba(0, 242, 254, 0.35);
      color: var(--accent-cyan);
    }

    .status-block {
      text-align: center;
      margin: 4px 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }

    .state-connecting .status-pill {
      border-color: rgba(245, 158, 11, 0.4);
      color: #fde68a;
      background: rgba(245, 158, 11, 0.1);
    }
    .state-connecting .status-dot {
      background: var(--accent-amber);
      box-shadow: 0 0 10px var(--accent-amber);
    }

    .state-connected .status-pill {
      border-color: rgba(16, 185, 129, 0.4);
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.12);
    }
    .state-connected .status-dot {
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
    }

    .timer-display {
      font-size: 30px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1.5px;
    }

    .step-hint {
      font-size: 12px;
      color: var(--text-muted);
      min-height: 18px;
      margin-top: 2px;
    }

    .power-zone {
      position: relative;
      height: 195px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ripple-ring {
      position: absolute;
      width: 142px;
      height: 142px;
      border-radius: 50%;
      border: 1.5px solid rgba(16, 185, 129, 0.4);
      opacity: 0;
      pointer-events: none;
    }

    .state-connected .ripple-ring.r1 {
      animation: rippleWave 2.6s infinite cubic-bezier(0.16, 1, 0.3, 1);
    }
    .state-connected .ripple-ring.r2 {
      animation: rippleWave 2.6s infinite 1.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes rippleWave {
      0% { transform: scale(1); opacity: 0.75; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .spinner-ring {
      position: absolute;
      width: 158px;
      height: 158px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-top-color: var(--accent-cyan);
      border-right-color: rgba(79, 172, 254, 0.35);
      opacity: 0;
      pointer-events: none;
    }

    .state-connecting .spinner-ring {
      opacity: 1;
      animation: spinCW 1.1s linear infinite;
    }

    @keyframes spinCW { to { transform: rotate(360deg); } }

    .power-btn {
      position: relative;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.14);
      background: radial-gradient(circle at 35% 30%, #1e293b, #0f172a 75%);
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.65);
      transition: all 0.35s var(--ease-out);
      z-index: 2;
    }

    .power-btn:active {
      transform: scale(0.93);
    }

    .state-connected .power-btn {
      border-color: rgba(16, 185, 129, 0.85);
      background: radial-gradient(circle at 35% 30%, rgba(16, 185, 129, 0.3), #0f172a 75%);
      color: #34d399;
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.35);
    }

    .power-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .node-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 13px;
    }

    .state-connected .node-card {
      border-color: rgba(16, 185, 129, 0.35);
    }

    .node-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .node-main {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .node-badge-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .node-titles {
      min-width: 0;
    }

    .node-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-host {
      font-size: 11px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .node-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .ping-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
      cursor: pointer;
    }

    .node-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tech-chip {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .tech-chip.highlight {
      background: rgba(0, 242, 254, 0.12);
      color: var(--accent-cyan);
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .speed-box {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 11px;
    }

    .speed-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .speed-val {
      font-size: 17px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .speed-unit {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 3px;
    }

    .speed-canvas {
      width: 100%;
      height: 28px;
      display: block;
      margin-top: 5px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 5, 10, 0.8);
      backdrop-filter: blur(6px);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s var(--ease-out);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      max-width: 480px;
      max-height: 86dvh;
      background: #101520;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px 22px 0 0;
      padding: 16px 16px calc(env(safe-area-inset-bottom, 16px) + 14px);
      transform: translateY(100%);
      transition: transform 0.32s var(--ease-out);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-backdrop.open .sheet {
      transform: translateY(0);
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 800;
    }

    .close-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: 1px solid var(--border-glass);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      cursor: pointer;
    }

    .profiles-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 48dvh;
    }

    .profile-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      cursor: pointer;
    }

    .profile-item.active {
      background: rgba(0, 242, 254, 0.09);
      border-color: rgba(0, 242, 254, 0.45);
    }

    .profile-info {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-actions {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border-glass);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      cursor: pointer;
    }

    .input-box, .code-view {
      width: 100%;
      min-height: 110px;
      max-height: 42dvh;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #a5f3fc;
      padding: 10px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .primary-btn {
      flex: 1;
      height: 42px;
      border-radius: 11px;
      border: none;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #041019;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }

    .secondary-btn {
      height: 42px;
      padding: 0 13px;
      border-radius: 11px;
      border: 1px solid var(--border-glass);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #1e293b;
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: #f8fafc;
      padding: 9px 15px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 600;
      z-index: 100;
      transition: transform 0.28s var(--ease-out);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast">Готово</div>

  <div id="app" class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">AetherVPN</div>
          <div class="brand-sub" id="coreBadge">Xray-core Native</div>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="openLogsBtn" type="button">Логи / Ядро</button>
        <button class="icon-btn add-btn" id="openAddModalBtn" type="button">+ Ключ</button>
        <button class="icon-btn" id="openProfilesBtn" type="button">☰</button>
      </div>
    </header>

    <section class="status-block">
      <div class="status-pill">
        <span class="status-dot"></span>
        <span id="statusText">Отключено</span>
      </div>
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <div class="step-hint" id="stepHint">Нажмите кнопку для запуска Xray-core</div>
    </section>

    <section class="power-zone">
      <div class="ripple-ring r1"></div>
      <div class="ripple-ring r2"></div>
      <div class="spinner-ring"></div>

      <button class="power-btn" id="powerBtn" type="button">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
        <span class="power-label" id="powerLabel">Старт</span>
      </button>
    </section>

    <section>
      <div class="node-card">
        <div class="node-header" id="nodeHeaderClick">
          <div class="node-main">
            <div class="node-badge-icon" id="nodeIcon">🇵🇱</div>
            <div class="node-titles">
              <div class="node-name" id="nodeName">Загрузка...</div>
              <div class="node-host" id="nodeHost">—</div>
            </div>
          </div>
          <div class="node-right">
            <span class="ping-tag" id="nodePing" title="Нажмите для проверки пинга">Пинг...</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b9bb4" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
        <div class="node-tags" id="nodeTags"></div>
      </div>

      <div class="telemetry-grid">
        <div class="speed-box">
          <div class="speed-top">
            <span>СКАЧИВАНИЕ</span>
            <span style="color:#00f2fe">↓</span>
          </div>
          <div>
            <span class="speed-val" id="dlSpeed">0.0</span>
            <span class="speed-unit" id="dlUnit">КБ/с</span>
          </div>
          <canvas id="dlCanvas" class="speed-canvas" width="160" height="28"></canvas>
        </div>

        <div class="speed-box">
          <div class="speed-top">
            <span>ОТДАЧА</span>
            <span style="color:#10b981">↑</span>
          </div>
          <div>
            <span class="speed-val" id="ulSpeed">0.0</span>
            <span class="speed-unit" id="ulUnit">КБ/с</span>
          </div>
          <canvas id="ulCanvas" class="speed-canvas" width="160" height="28"></canvas>
        </div>
      </div>
    </section>
  </div>

  <!-- Список профилей -->
  <div class="modal-backdrop" id="profilesModal">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title">Ваши VLESS ключи</div>
        <button class="close-btn" id="closeProfilesBtn" type="button">✕</button>
      </div>
      <div class="profiles-list" id="profilesList"></div>
      <button class="primary-btn" id="switchToAddModalBtn" type="button">+ Добавить ссылку vless://</button>
    </div>
  </div>

  <!-- Добавление ключа -->
  <div class="modal-backdrop" id="addModal">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title">Импорт ключа vless://</div>
        <button class="close-btn" id="closeAddBtn" type="button">✕</button>
      </div>
      <textarea id="vlessInput" class="input-box" placeholder="vless://uuid@host:443?security=tls&type=grpc#Название"></textarea>
      <div class="btn-row">
        <button class="secondary-btn" id="pasteClipBtn" type="button">Вставить</button>
        <button class="primary-btn" id="saveVlessBtn" type="button">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Консоль логов Xray-core и JSON конфига -->
  <div class="modal-backdrop" id="logsModal">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title">Консоль Xray-core и JSON</div>
        <button class="close-btn" id="closeLogsBtn" type="button">✕</button>
      </div>
      <div class="btn-row">
        <button class="secondary-btn" id="showLiveLogsBtn" type="button" style="flex:1">Логи процесса Xray</button>
        <button class="secondary-btn" id="showConfigJsonBtn" type="button" style="flex:1">JSON Конфиг</button>
      </div>
      <pre id="consoleBox" class="code-view">Ожидание запуска Xray-core...</pre>
    </div>
  </div>

  <script>
    const DEFAULT_VLESS_URI = "vless://647640d8-c26c-42bf-aa78-48a2f8d9759d@parts.skodamotors.online:443?mode=gun&security=tls&alpn=h2&encryption=none&authority=parts.skodamotors.online&fp=chrome&type=grpc&serviceName=1ae7ea2a8adf&sni=parts.skodamotors.online#%F0%9F%87%B5%F0%9F%87%B1%20%D0%9F%D0%BE%D0%BB%D1%8C%D1%88%D0%B0%20%E2%80%94%20Reality%202%20%F0%9F%9B%B0%EF%B8%8F";

    const hasNativeXray = typeof window.AndroidXray !== "undefined";
    document.getElementById("coreBadge").textContent = hasNativeXray ? "Xray-core Embedded" : "Web Preview Mode";

    function parseVlessUri(rawUri) {
      const uri = rawUri.trim();
      if (!uri.startsWith("vless://")) {
        throw new Error("Поддерживаются ссылки формата vless://");
      }

      let rest = uri.slice(8);
      let remark = "VLESS Server";
      if (rest.includes("#")) {
        const parts = rest.split("#");
        rest = parts[0];
        try {
          remark = decodeURIComponent(parts.slice(1).join("#")).trim() || remark;
        } catch (e) {
          remark = parts[1];
        }
      }

      let queryString = "";
      if (rest.includes("?")) {
        const qParts = rest.split("?");
        rest = qParts[0];
        queryString = qParts.slice(1).join("?");
      }

      const atParts = rest.split("@");
      const uuid = atParts[0] || "";
      const hostPort = atParts[1] || "";
      const hp = hostPort.split(":");

      const port = parseInt((hp[1] || "443").replace("/", ""), 10);

      const params = new URLSearchParams(queryString);
      const flagMatch = remark.match(/(\p{Regional_Indicator}{2})/u);

      return {
        id: "node_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        raw: uri,
        name: remark,
        icon: flagMatch ? flagMatch[1] : "🛰️",
        uuid,
        host,
        port,
        encryption: params.get("encryption") || "none",
        flow: params.get("flow") || "",
        type: (params.get("type") || "tcp").toLowerCase(),
        security: (params.get("security") || "none").toLowerCase(),
        sni: params.get("sni") || params.get("authority") || host,
        authority: params.get("authority") || params.get("sni") || host,
        fp: params.get("fp") || "chrome",
        alpn: params.get("alpn") || "h2",
        mode: params.get("mode") || "gun",
        serviceName: params.get("serviceName") || "",
        pbk: params.get("pbk") || "",
        sid: params.get("sid") || "",
        spx: params.get("spx") || "/",
        path: params.get("path") || "/"
      };
    }

    // Генерация реального JSON-конфига для бинарника libxray.so
    function buildXrayConfig(node) {
      const streamSettings = {
        network: node.type,
        security: node.security
      };

      if (node.security === "tls") {
        streamSettings.tlsSettings = {
          serverName: node.sni,
          allowInsecure: false,
          alpn: node.alpn ? node.alpn.split(",") : ["h2", "http/1.1"],
          fingerprint: node.fp || "chrome"
        };
      } else if (node.security === "reality") {
        streamSettings.realitySettings = {
          serverName: node.sni,
          fingerprint: node.fp || "chrome",
          publicKey: node.pbk,
          shortId: node.sid,
          spiderX: node.spx || "/"
        };
      }

      if (node.type === "grpc") {
        streamSettings.grpcSettings = {
          serviceName: node.serviceName,
          multiMode: node.mode === "multi",
          authority: node.authority || node.sni
        };
      } else if (node.type === "ws") {
        streamSettings.wsSettings = {
          path: node.path || "/",
          headers: { Host: node.sni }
        };
      }

      const userObj = {
        id: node.uuid,
        encryption: node.encryption || "none"
      };
      if (node.flow) userObj.flow = node.flow;

      return {
        log: { loglevel: "info" },
        inbounds: [
          {
            tag: "socks-in",
            port: 10808,
            listen: "127.0.0.1",
            protocol: "socks",
            settings: { auth: "noauth", udp: true }
          },
          {
            tag: "http-in",
            port: 10809,
            listen: "127.0.0.1",
            protocol: "http",
            settings: {}
          }
        ],
        outbounds: [
          {
            tag: "proxy",
            protocol: "vless",
            settings: {
              vnext: [
                {
                  address: node.host,
                  port: Number(node.port),
                  users: [userObj]
                }
              ]
            },
            streamSettings
          },
          { tag: "direct", protocol: "freedom" }
        ]
      };
    }
