<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MVZ — Happ Style VLESS & Trojan</title>
  <style>
    /* 1. Фиолетовая тема (MVZ Purple) */
    :root, [data-theme="purple"] {
      --bg-dark: #090514;
      --bg-glow: rgba(168, 85, 247, 0.25);
      --bg-card: rgba(22, 12, 40, 0.9);
      --bg-card-2: rgba(34, 19, 61, 0.85);
      --sheet-bg: #130a24;
      --border-glass: rgba(216, 180, 254, 0.15);
      --text-main: #f8fafc;
      --text-muted: #b197fc;
      --accent-primary: #c084fc;
      --accent-secondary: #6366f1;
      --btn-core-bg: radial-gradient(circle at 35% 30%, #3b0764, #120624 75%);
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
    }

    /* 2. Черная тема (Onyx Black) */
    [data-theme="black"] {
      --bg-dark: #040609;
      --bg-glow: rgba(0, 242, 254, 0.16);
      --bg-card: rgba(13, 17, 25, 0.92);
      --bg-card-2: rgba(21, 27, 40, 0.85);
      --sheet-bg: #0b0e15;
      --border-glass: rgba(255, 255, 255, 0.1);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-primary: #00f2fe;
      --accent-secondary: #3b82f6;
      --btn-core-bg: radial-gradient(circle at 35% 30%, #1e293b, #070a10 75%);
    }

    /* 3. Белая тема (Arctic Light) */
    [data-theme="white"] {
      --bg-dark: #eef2f8;
      --bg-glow: rgba(99, 102, 241, 0.18);
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-card-2: rgba(241, 245, 249, 0.95);
      --sheet-bg: #ffffff;
      --border-glass: rgba(15, 23, 42, 0.11);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-primary: #6366f1;
      --accent-secondary: #9333ea;
      --btn-core-bg: radial-gradient(circle at 35% 30%, #ffffff, #dbeafe 75%);
    }

    /* 4. Киберпанк / Багровая (Crimson Cyber) */
    [data-theme="crimson"] {
      --bg-dark: #0d0307;
      --bg-glow: rgba(244, 63, 94, 0.25);
      --bg-card: rgba(31, 9, 17, 0.9);
      --bg-card-2: rgba(48, 13, 26, 0.82);
      --sheet-bg: #19070e;
      --border-glass: rgba(251, 113, 133, 0.17);
      --text-main: #fff1f2;
      --text-muted: #fda4af;
      --accent-primary: #fb7185;
      --accent-secondary: #e11d48;
      --btn-core-bg: radial-gradient(circle at 35% 30%, #500724, #160309 75%);
    }

    /* 5. Изумрудная Матрица (Emerald Matrix) */
    [data-theme="emerald"] {
      --bg-dark: #020b08;
      --bg-glow: rgba(16, 185, 129, 0.24);
      --bg-card: rgba(7, 26, 19, 0.9);
      --bg-card-2: rgba(11, 39, 29, 0.82);
      --sheet-bg: #061610;
      --border-glass: rgba(52, 211, 153, 0.17);
      --text-main: #ecfdf5;
      --text-muted: #6ee7b7;
      --accent-primary: #34d399;
      --accent-secondary: #059669;
      --btn-core-bg: radial-gradient(circle at 35% 30%, #064e3b, #03130d 75%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Строгий запрет горизонтального вылезания на любых экранах */
    html, body {
      width: 100%;
      max-width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    svg {
      display: block;
      flex-shrink: 0;
    }

    .app-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      max-width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 7px;
      padding: 8px 10px;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 28%, var(--bg-glow) 0%, transparent 70%);
      overflow: hidden;
    }

    .app-shell.state-connecting {
      background-image: radial-gradient(circle at 50% 28%, rgba(245, 158, 11, 0.25) 0%, transparent 70%);
    }

    .app-shell.state-connected {
      background-image: radial-gradient(circle at 50% 28%, rgba(16, 185, 129, 0.28) 0%, var(--bg-glow) 52%, transparent 75%);
    }

    /* 1. ШАПКА */
    .top-bar {
      width: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 7px 10px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      overflow: hidden;
      border: 1.5px solid var(--accent-primary);
      flex-shrink: 0;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.6px;
    }

    .proto-pill {
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 5px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #fff;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-right-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .scale-btn {
      height: 30px;
      padding: 0 8px;
      border-radius: 9px;
      background: var(--bg-card-2);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
    }

    .status-mini {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--bg-card-2);
      border: 1px solid var(--border-glass);
      font-size: 10.5px;
      font-weight: 800;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-primary);
      box-shadow: 0 0 8px var(--accent-primary);
      animation: dotPulse 1.6s infinite ease-in-out;
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(0.85); opacity: 0.5; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    .state-connecting .status-dot {
      background: var(--accent-amber);
      box-shadow: 0 0 10px var(--accent-amber);
    }

    .state-connected .status-dot {
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      animation: none;
    }

    /* 2. КАРТОЧКА ПОДПИСКИ В СТИЛЕ ПРИЛОЖЕНИЯ HAPP */
    .happ-sub-card {
      width: 100%;
      min-width: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }

    .sub-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-width: 0;
    }

    .sub-title-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .sub-badge {
      font-size: 9.5px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(16, 185, 129, 0.16);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.35);
      flex-shrink: 0;
    }

    .sub-badge.expired {
      background: rgba(239, 68, 68, 0.16);
      color: var(--accent-red);
      border-color: rgba(239, 68, 68, 0.35);
    }

    .sub-expire-text {
      font-size: 11.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .sub-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .sub-mini-btn {
      font-size: 10px;
      font-weight: 800;
      padding: 4px 7px;
      border-radius: 7px;
      border: 1px solid var(--border-glass);
      background: var(--bg-card-2);
      color: var(--text-main);
      cursor: pointer;
    }

    .sub-progress-track {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.2);
      overflow: hidden;
    }

    .sub-progress-fill {
      height: 100%;
      width: 80%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-green));
    }

    .sub-meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* 3. КОМПАКТНОЕ ЯДРО С АНИМАЦИЕЙ ДО НАЖАТИЯ + ТЕЛЕМЕТРИЯ */
    .core-stage {
      width: 100%;
      min-width: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .power-zone {
      position: relative;
      width: 122px;
      height: 122px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .idle-pulse-ring {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 1.5px solid var(--accent-primary);
      opacity: 0;
      pointer-events: none;
      animation: idleRadar 3s infinite cubic-bezier(0.2, 0.8, 0.4, 1);
    }

    .idle-pulse-ring.delay {
      animation-delay: 1.5s;
    }

    @keyframes idleRadar {
      0% { transform: scale(0.92); opacity: 0.6; }
      100% { transform: scale(1.38); opacity: 0; }
    }

    .idle-orbit-outer {
      position: absolute;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      border: 1.5px dashed var(--border-glass);
      border-top-color: var(--accent-primary);
      border-bottom-color: var(--accent-secondary);
      pointer-events: none;
      animation: spinCW 8s linear infinite;
    }

    .idle-orbit-outer::after {
      content: "";
      position: absolute;
      top: -3.5px;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-primary);
      box-shadow: 0 0 8px var(--accent-primary);
    }

    .idle-orbit-inner {
      position: absolute;
      width: 102px;
      height: 102px;
      border-radius: 50%;
      border: 1.5px dotted var(--border-glass);
      border-left-color: var(--accent-primary);
      pointer-events: none;
      animation: spinCCW 5.5s linear infinite;
    }

    @keyframes spinCW { to { transform: rotate(360deg); } }
    @keyframes spinCCW { to { transform: rotate(-360deg); } }

    .state-connecting .idle-orbit-outer {
      border-style: solid;
      border-color: transparent;
      border-top-color: var(--accent-amber);
      border-right-color: var(--accent-amber);
      animation: spinCW 0.85s linear infinite;
    }

    .state-connected .idle-pulse-ring { border-color: var(--accent-green); }
    .state-connected .idle-orbit-outer {
      border-top-color: var(--accent-green);
      border-bottom-color: var(--accent-green);
    }
    .state-connected .idle-orbit-outer::after {
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
    }

    .power-btn {
      position: relative;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      border: 2px solid var(--accent-primary);
      background: var(--btn-core-bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      z-index: 2;
      animation: idleBtnBreathe 2.6s ease-in-out infinite;
    }

    @keyframes idleBtnBreathe {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5), 0 0 12px var(--bg-glow);
      }
      50% {
        transform: scale(1.045);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 22px var(--accent-primary);
      }
    }

    .state-connected .power-btn {
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .power-label {
      font-size: 9.5px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .core-stats-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .timer-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px;
    }

    .timer-display {
      font-size: 19px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.8px;
    }

    .mini-speeds {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .mini-speed-card {
      background: var(--bg-card-2);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      padding: 5px 7px;
      min-width: 0;
    }

    .ms-label {
      font-size: 9px;
      font-weight: 800;
      color: var(--text-muted);
    }

    .ms-val {
      font-size: 13px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .step-hint {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 4. ВЕРТИКАЛЬНЫЙ СПИСОК МАРШРУТОВ ПОДПИСКИ КАК В HAPP (ЗАПОЛНЯЕТ ЭКРАН) */
    .happ-routes-section {
      width: 100%;
      min-width: 0;
      flex: 1;
      min-height: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .routes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .routes-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }

    .route-item {
      width: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--bg-card-2);
      border: 1.5px solid var(--border-glass);
      cursor: pointer;
      flex-shrink: 0;
    }

    .route-item.active {
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--bg-glow);
    }

    .route-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .route-flag {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .route-info {
      min-width: 0;
      flex: 1;
    }

    .route-title {
      font-size: 12.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .r-badge {
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(192, 132, 252, 0.2);
      color: var(--accent-primary);
      text-transform: uppercase;
    }

    .r-badge.trojan {
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent-amber);
    }

    .route-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .route-ping {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--accent-green);
    }

    /* 5. НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ */
    .bottom-nav {
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 5px;
      flex-shrink: 0;
    }

    .nav-btn {
      height: 38px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      font-size: 9.5px;
      font-weight: 800;
      cursor: pointer;
      min-width: 0;
    }

    .nav-btn.primary-action {
      background: var(--bg-card-2);
      border-color: var(--border-glass);
      color: var(--accent-primary);
    }

    /* МОДАЛЬНЫЕ ОКНА */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 5, 10, 0.82);
      backdrop-filter: blur(6px);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      max-width: 100%;
      max-height: 88dvh;
      background: var(--sheet-bg);
      color: var(--text-main);
      border-top: 1px solid var(--border-glass);
      border-radius: 20px 20px 0 0;
      padding: 14px 12px 18px;
      transform: translateY(100%);
      transition: transform 0.26s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .modal-backdrop.open .sheet {
      transform: translateY(0);
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-title {
      font-size: 15px;
      font-weight: 900;
    }

    .close-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border-glass);
      background: rgba(128, 128, 128, 0.14);
      color: var(--text-main);
      cursor: pointer;
    }

    .tabs-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--bg-card);
      padding: 4px;
      border-radius: 10px;
    }

    .tab-btn {
      height: 32px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #fff;
    }

    .input-box, .code-view {
      width: 100%;
      min-height: 95px;
      max-height: 38dvh;
      border-radius: 11px;
      background: rgba(0, 0, 0, 0.38);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 9px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .field-input {
      width: 100%;
      height: 36px;
      border-radius: 9px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 0 9px;
      font-size: 11.5px;
      user-select: text;
    }

    .btn-row {
      display: flex;
      gap: 7px;
    }

    .primary-btn {
      flex: 1;
      height: 40px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #ffffff;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
    }

    .secondary-btn {
      height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border-glass);
      background: var(--bg-card);
      color: var(--text-main);
      font-weight: 700;
      font-size: 11.5px;
      cursor: pointer;
    }

    .themes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .theme-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      border-radius: 11px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-glass);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .theme-card.active {
      border-color: var(--accent-primary);
    }

    .theme-swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
    }

    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--sheet-bg);
      border: 1.5px solid var(--accent-primary);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 800;
      z-index: 100;
      transition: transform 0.25s ease;
      pointer-events: none;
      max-width: 92%;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
