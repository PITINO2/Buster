steps:
  - name: 1. Скачивание файлов репозитория
    uses: actions/checkout@v4

  - name: 2. Установка Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: 3. Установка Java JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: 4. Настройка Android SDK
    uses: android-actions/setup-android@v3

  - name: 5. Инициализация Capacitor и создание Android-проекта
    run: |
      mkdir -p www
      cp index.html www/index.html

      npm init -y
      npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      cat << 'EOF' > capacitor.config.json
      {
        "appId": "com.aethervpn.app",
        "appName": "AetherVPN",
        "webDir": "www",
        "server": {
          "androidScheme": "https"
        }
      }
      EOF

      npx cap add android
      npx cap copy android

  - name: 6. Компиляция APK через Gradle
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: 7. Выгрузка готового APK-файла
    uses: actions/upload-artifact@v4
    with:
      name: AetherVPN-Android-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
