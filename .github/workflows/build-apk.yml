name: Build MVZ APK with Xray Core

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание файлов репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установка Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Инициализация Capacitor (MVZ)
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            echo "ОШИБКА: Файл index.html не найден в корне репозитория!"
            exit 1
          fi

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mvzvpn.app",
            "appName": "MVZ",
            "webDir": "www",
            "backgroundColor": "#0b0c10"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Генерация 3D-иконки клоуна MVZ и системных стилей
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.png
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.webp

          cat << 'EOF' > clown_exact.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
              <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8b1da8"/>
                <stop offset="52%" stop-color="#58237a"/>
                <stop offset="100%" stop-color="#221f4c"/>
              </linearGradient>
              <radialGradient id="faceGrad" cx="42%" cy="35%" r="58%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="55%" stop-color="#f3f0d8"/>
                <stop offset="88%" stop-color="#dcd7b6"/>
                <stop offset="100%" stop-color="#bfb993"/>
              </radialGradient>
              <radialGradient id="hairGrad" cx="38%" cy="32%" r="65%">
                <stop offset="0%" stop-color="#ff6b4a"/>
                <stop offset="55%" stop-color="#e02b19"/>
                <stop offset="100%" stop-color="#941106"/>
              </radialGradient>
              <radialGradient id="noseGrad" cx="35%" cy="30%" r="65%">
                <stop offset="0%" stop-color="#ff857a"/>
                <stop offset="40%" stop-color="#ef2917"/>
                <stop offset="100%" stop-color="#8f0b00"/>
              </radialGradient>
              <radialGradient id="cheeks" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ff7714" stop-opacity="0.88"/>
                <stop offset="55%" stop-color="#ff7714" stop-opacity="0.42"/>
                <stop offset="100%" stop-color="#ff7714" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="lipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ef2319"/>
                <stop offset="50%" stop-color="#c91008"/>
                <stop offset="100%" stop-color="#8f0600"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
            <circle cx="152" cy="148" r="44" fill="url(#hairGrad)"/>
            <circle cx="112" cy="186" r="46" fill="url(#hairGrad)"/>
            <circle cx="104" cy="242" r="42" fill="url(#hairGrad)"/>
            <circle cx="360" cy="148" r="44" fill="url(#hairGrad)"/>
            <circle cx="400" cy="186" r="46" fill="url(#hairGrad)"/>
            <circle cx="408" cy="242" r="42" fill="url(#hairGrad)"/>
            <circle cx="256" cy="276" r="168" fill="url(#faceGrad)"/>
            <circle cx="144" cy="292" r="52" fill="url(#cheeks)"/>
            <circle cx="368" cy="292" r="52" fill="url(#cheeks)"/>
            <path d="M168 156 Q198 124 228 154" fill="none" stroke="#181210" stroke-width="10.5" stroke-linecap="round"/>
            <path d="M284 154 Q314 124 344 156" fill="none" stroke="#181210" stroke-width="10.5" stroke-linecap="round"/>
            <ellipse cx="198" cy="222" rx="34" ry="54" fill="#ffffff" stroke="#1e6296" stroke-width="14"/>
            <ellipse cx="314" cy="222" rx="34" ry="54" fill="#ffffff" stroke="#1e6296" stroke-width="14"/>
            <ellipse cx="198" cy="224" rx="16.5" ry="33" fill="#0d0d0d"/>
            <ellipse cx="314" cy="224" rx="16.5" ry="33" fill="#0d0d0d"/>
            <path d="M148 318 C184 358, 328 358, 364 318 C354 398, 298 422, 256 422 C214 422, 158 398, 148 318 Z"
                  fill="#ffffff" stroke="url(#lipGrad)" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
            <circle cx="256" cy="272" r="31" fill="url(#noseGrad)"/>
            <ellipse cx="246" cy="261" rx="9" ry="6" fill="#ffffff" opacity="0.45" transform="rotate(-20 246 261)"/>
          </svg>
          EOF

          if [ -f "icon.png" ]; then
            cp icon.png base_icon.png
          elif [ -f "icon.jpg" ]; then
            convert icon.jpg base_icon.png
          else
            rsvg-convert -w 512 -h 512 clown_exact.svg -o base_icon.png
          fi

          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
            cp base_icon.png android/app/src/main/res/$dir/ic_launcher.png
            cp base_icon.png android/app/src/main/res/$dir/ic_launcher_round.png
            cp base_icon.png android/app/src/main/res/$dir/ic_launcher_foreground.png
          done

          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">MVZ</string>
              <string name="title_activity_main">MVZ</string>
              <string name="package_name">com.mvzvpn.app</string>
              <string name="custom_url_scheme">com.mvzvpn.app</string>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#0b0c10</item>
                  <item name="colorPrimaryDark">#0b0c10</item>
                  <item name="colorAccent">#6366f1</item>
                  <item name="android:windowBackground">#0b0c10</item>
                  <item name="android:statusBarColor">#0b0c10</item>
                  <item name="android:navigationBarColor">#0b0c10</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">#0b0c10</item>
              </style>
          </resources>
          EOF

      - name: Скачивание официального ядра Xray-core (arm64-v8a)
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          unzip -o xray.zip xray -d xray_bin
          cp xray_bin/xray android/app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod 755 android/app/src/main/jniLibs/arm64-v8a/libxray.so

      - name: Внедрение Android VpnService с уведомлением активного маршрута
        run: |
          mkdir -p android/app/src/main/java/com/mvzvpn/app

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="MVZ"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:extractNativeLibs="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="com.mvzvpn.app.MainActivity"
                      android:label="MVZ"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name="com.mvzvpn.app.AetherVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > android/app/src/main/java/com/mvzvpn/app/AetherVpnService.java
          package com.mvzvpn.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.net.ProxyInfo;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public class AetherVpnService extends VpnService {
              private static final String CHANNEL_ID = "mvz_vpn_status_channel";
              private static final int NOTIF_ID = 1001;
              private ParcelFileDescriptor vpnInterface = null;
              private Process xrayProcess = null;
              public static volatile boolean isRunning = false;
              public static volatile String currentRouteName = "";
              public static final List<String> logs = Collections.synchronizedList(new ArrayList<>());

              public static void addLog(String msg) {
                  synchronized (logs) {
                      if (logs.size() > 100) {
                          logs.remove(0);
                      }
                      logs.add(msg);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "STOP".equals(intent.getAction())) {
                      stopVpn();
                      return START_NOT_STICKY;
                  }
                  String configJson = intent != null ? intent.getStringExtra("configJson") : null;
                  String routeName = intent != null ? intent.getStringExtra("routeName") : "VLESS Маршрут";
                  if (configJson != null) {
                      startVpn(configJson, routeName != null ? routeName : "VLESS Маршрут");
                  }
                  return START_STICKY;
              }

              private void showRouteNotification(String routeName) {
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                          NotificationChannel channel = new NotificationChannel(
                                  CHANNEL_ID,
                                  "MVZ VPN Активный маршрут",
                                  NotificationManager.IMPORTANCE_LOW
                          );
                          channel.setDescription("Показывает текущий подключенный маршрут MVZ VPN");
                          nm.createNotificationChannel(channel);
                      }

                      Intent openIntent = new Intent(this, MainActivity.class);
                      int piFlags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                              ? PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                              : PendingIntent.FLAG_UPDATE_CURRENT;
                      PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, openIntent, piFlags);

                      Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                              ? new Notification.Builder(this, CHANNEL_ID)
                              : new Notification.Builder(this);

                      Notification notification = nb
                              .setContentTitle("MVZ VPN • Подключено")
                              .setContentText("Маршрут: " + routeName)
                              .setSmallIcon(getApplicationInfo().icon)
                              .setContentIntent(pendingIntent)
                              .setOngoing(true)
                              .build();

                      startForeground(NOTIF_ID, notification);
                  } catch (Exception e) {
                      addLog("[NOTIF-WARN] " + e.getMessage());
                  }
              }

              private void startVpn(String configJson, String routeName) {
                  stopVpnInternal();
                  logs.clear();
                  try {
                      currentRouteName = routeName;
                      File configFile = new File(getFilesDir(), "xray_config.json");
                      try (FileOutputStream fos = new FileOutputStream(configFile, false)) {
                          fos.write(configJson.getBytes(StandardCharsets.UTF_8));
                      }

                      String xrayPath = getApplicationInfo().nativeLibraryDir + "/libxray.so";
                      File xrayBin = new File(xrayPath);
                      xrayBin.setExecutable(true);

                      addLog("[MVZ-CORE] Запуск маршрута: " + routeName);
                      ProcessBuilder pb = new ProcessBuilder(xrayPath, "run", "-c", configFile.getAbsolutePath());
                      pb.directory(getFilesDir());
                      pb.redirectErrorStream(true);
                      xrayProcess = pb.start();

                      new Thread(() -> {
                          try (BufferedReader reader = new BufferedReader(
                                  new InputStreamReader(xrayProcess.getInputStream(), StandardCharsets.UTF_8))) {
                              String line;
                              while ((line = reader.readLine()) != null) {
                                  addLog(line);
                              }
                          } catch (Exception e) {
                              addLog("[CORE-END] " + e.getMessage());
                          }
                      }).start();

                      Builder builder = new Builder();
                      builder.setSession("MVZ: " + routeName);
                      builder.setMtu(1500);
                      builder.addAddress("10.10.0.1", 32);
                      builder.addDnsServer("1.1.1.1");
                      builder.addDnsServer("8.8.8.8");

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          builder.setHttpProxy(ProxyInfo.buildDirectProxy("127.0.0.1", 10809));
                      }

                      vpnInterface = builder.establish();
                      showRouteNotification(routeName);
                      isRunning = true;
                      addLog("[MVZ-TUN] Подключено к маршруту: " + routeName);
                  } catch (Exception e) {
                      addLog("[ERROR] Ошибка запуска: " + e.getMessage());
                      isRunning = false;
                  }
              }

              private void stopVpnInternal() {
                  isRunning = false;
                  currentRouteName = "";
                  if (xrayProcess != null) {
                      try {
                          xrayProcess.destroyForcibly();
                      } catch (Exception ignored) {}
                      xrayProcess = null;
                  }
                  if (vpnInterface != null) {
                      try {
                          vpnInterface.close();
                      } catch (Exception ignored) {}
                      vpnInterface = null;
                  }
                  try {
                      stopForeground(true);
                  } catch (Exception ignored) {}
              }

              private void stopVpn() {
                  addLog("[STOP] Остановка MVZ Xray-core...");
                  stopVpnInternal();
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  stopVpnInternal();
                  super.onDestroy();
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/mvzvpn/app/MainActivity.java
          package com.mvzvpn.app;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.TrafficStats;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import android.webkit.JavascriptInterface;

          import com.getcapacitor.BridgeActivity;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.security.SecureRandom;
          import java.security.cert.X509Certificate;

          import javax.net.ssl.HttpsURLConnection;
          import javax.net.ssl.SSLContext;
          import javax.net.ssl.TrustManager;
          import javax.net.ssl.X509TrustManager;

          public class MainActivity extends BridgeActivity {
              private static final int VPN_REQUEST_CODE = 1901;
              private String pendingConfigJson = null;
              private String pendingRouteName = "VLESS Маршрут";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  applyBarsColor("#0b0c10");
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().setBackgroundColor(Color.parseColor("#0b0c10"));
                      getBridge().getWebView().addJavascriptInterface(new XrayBridge(), "AndroidXray");
                  }
              }

              private void applyBarsColor(String hexColor) {
                  runOnUiThread(() -> {
                      try {
                          int c = Color.parseColor(hexColor);
                          Window window = getWindow();
                          window.setStatusBarColor(c);
                          window.setNavigationBarColor(c);
                          window.getDecorView().setBackgroundColor(c);
                      } catch (Exception ignored) {}
                  });
              }

              private void launchVpnService(String configJson, String routeName) {
                  Intent serviceIntent = new Intent(this, AetherVpnService.class);
                  serviceIntent.putExtra("configJson", configJson);
                  serviceIntent.putExtra("routeName", routeName);
                  startService(serviceIntent);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == VPN_REQUEST_CODE) {
                      if (resultCode == RESULT_OK && pendingConfigJson != null) {
                          launchVpnService(pendingConfigJson, pendingRouteName);
                      } else {
                          AetherVpnService.addLog("[WARN] Разрешение на VPN отклонено");
                      }
                  }
              }

              public class XrayBridge {
                  @JavascriptInterface
                  public void setSystemBarsColor(String hexColor) {
                      applyBarsColor(hexColor);
                  }

                  @JavascriptInterface
                  public String startXray(String configJson, String routeName) {
                      pendingConfigJson = configJson;
                      pendingRouteName = (routeName != null && !routeName.isEmpty()) ? routeName : "VLESS Маршрут";
                      Intent prepareIntent = VpnService.prepare(MainActivity.this);
                      if (prepareIntent != null) {
                          startActivityForResult(prepareIntent, VPN_REQUEST_CODE);
                          return "PERMISSION_REQUESTED";
                      } else {
                          launchVpnService(pendingConfigJson, pendingRouteName);
                          return "STARTED";
                      }
                  }

                  @JavascriptInterface
                  public void stopXray() {
                      Intent serviceIntent = new Intent(MainActivity.this, AetherVpnService.class);
                      serviceIntent.setAction("STOP");
                      startService(serviceIntent);
                  }

                  @JavascriptInterface
                  public boolean isRunning() {
                      return AetherVpnService.isRunning;
                  }

                  @JavascriptInterface
                  public String getLogs() {
                      synchronized (AetherVpnService.logs) {
                          StringBuilder sb = new StringBuilder();
                          for (String line : AetherVpnService.logs) {
                              sb.append(line).append("\n");
                          }
                          return sb.toString();
                      }
                  }

                  @JavascriptInterface
                  public int pingHost(String host, int port) {
                      long start = System.currentTimeMillis();
                      try (Socket socket = new Socket()) {
                          socket.connect(new InetSocketAddress(host, port), 2500);
                          return (int) (System.currentTimeMillis() - start);
                      } catch (Exception e) {
                          return -1;
                      }
                  }

                  @JavascriptInterface
                  public String getTrafficBytes() {
                      long rx = TrafficStats.getTotalRxBytes();
                      long tx = TrafficStats.getTotalTxBytes();
                      return rx + ":" + tx;
                  }

                  @JavascriptInterface
                  public String fetchSubscription(String urlStr) {
                      try {
                          TrustManager[] trustAllCerts = new TrustManager[]{
                              new X509TrustManager() {
                                  public X509Certificate[] getAcceptedIssuers() { return new X509Certificate[0]; }
                                  public void checkClientTrusted(X509Certificate[] certs, String authType) {}
                                  public void checkServerTrusted(X509Certificate[] certs, String authType) {}
                              }
                          };
                          SSLContext sc = SSLContext.getInstance("TLS");
                          sc.init(null, trustAllCerts, new SecureRandom());
                          HttpsURLConnection.setDefaultSSLSocketFactory(sc.getSocketFactory());

                          URL url = new URL(urlStr.trim());
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          conn.setConnectTimeout(10000);
                          conn.setReadTimeout(10000);
                          conn.setRequestProperty("User-Agent", "Happ/2.4.0 (Android; v2rayNG/1.8.29; Xray-core)");
                          conn.setRequestProperty("Accept", "*/*");
                          conn.setInstanceFollowRedirects(true);

                          int code = conn.getResponseCode();
                          String userInfo = conn.getHeaderField("Subscription-Userinfo");
                          if (userInfo == null) userInfo = conn.getHeaderField("subscription-userinfo");

                          String profileTitle = conn.getHeaderField("Profile-Title");
                          if (profileTitle == null) profileTitle = conn.getHeaderField("profile-title");

                          InputStream is = (code >= 200 && code < 400) ? conn.getInputStream() : conn.getErrorStream();
                          BufferedReader reader = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = reader.readLine()) != null) {
                              sb.append(line).append("\n");
                          }
                          reader.close();

                          JSONObject res = new JSONObject();
                          res.put("ok", code >= 200 && code < 400);
                          res.put("status", code);
                          res.put("userinfo", userInfo != null ? userInfo : "");
                          res.put("title", profileTitle != null ? profileTitle : "");
                          res.put("body", sb.toString().trim());
                          return res.toString();
                      } catch (Exception e) {
                          try {
                              JSONObject err = new JSONObject();
                              err.put("ok", false);
                              err.put("error", e.getMessage());
                              return err.toString();
                          } catch (Exception ignored) {
                              return "{\"ok\":false}";
                          }
                      }
                  }
              }
          }
          EOF

      - name: Компиляция APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: MVZ-VPN-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
