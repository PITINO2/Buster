name: Build MVZ APK with Xray Core

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание файлов репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установка Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Инициализация Capacitor (MVZ)
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            echo "ОШИБКА: Файл index.html не найден в корне репозитория!"
            exit 1
          fi

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mvzvpn.app",
            "appName": "MVZ",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Установка иконки клоуна MVZ для Android APK
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.png
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.webp

          cat << 'EOF' > android/app/src/main/res/drawable/ic_mvz_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Фиолетово-индиговый фон -->
              <path android:fillColor="#5B21B6" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#7E22CE" android:pathData="M0,0 L108,0 L0,108 Z"/>
              <!-- Рыжие волосы по бокам -->
              <path android:fillColor="#DC2626" android:pathData="M24,42m-11,0a11,11 0,1 1,22 0a11,11 0,1 1,-22 0"/>
              <path android:fillColor="#EF4444" android:pathData="M29,31m-9,0a9,9 0,1 1,18 0a9,9 0,1 1,-18 0"/>
              <path android:fillColor="#B91C1C" android:pathData="M22,52m-8,0a8,8 0,1 1,16 0a8,8 0,1 1,-16 0"/>
              <path android:fillColor="#DC2626" android:pathData="M84,42m-11,0a11,11 0,1 1,22 0a11,11 0,1 1,-22 0"/>
              <path android:fillColor="#EF4444" android:pathData="M79,31m-9,0a9,9 0,1 1,18 0a9,9 0,1 1,-18 0"/>
              <path android:fillColor="#B91C1C" android:pathData="M86,52m-8,0a8,8 0,1 1,16 0a8,8 0,1 1,-16 0"/>
              <!-- Лицо -->
              <path android:fillColor="#F5F3E6" android:pathData="M54,56m-30,0a30,30 0,1 1,60 0a30,30 0,1 1,-60 0"/>
              <!-- Румянец -->
              <path android:fillColor="#FB923C" android:fillAlpha="0.55" android:pathData="M34,58m-6,0a6,6 0,1 1,12 0a6,6 0,1 1,-12 0"/>
              <path android:fillColor="#FB923C" android:fillAlpha="0.55" android:pathData="M74,58m-6,0a6,6 0,1 1,12 0a6,6 0,1 1,-12 0"/>
              <!-- Брови -->
              <path android:strokeColor="#111827" android:strokeWidth="2.4" android:strokeLineCap="round" android:pathData="M37,35 Q43,29 49,35"/>
              <path android:strokeColor="#111827" android:strokeWidth="2.4" android:strokeLineCap="round" android:pathData="M59,35 Q65,29 71,35"/>
              <!-- Глаза с синим контуром -->
              <path android:fillColor="#FFFFFF" android:strokeColor="#1D4ED8" android:strokeWidth="2.8" android:pathData="M37,46a6,9.5 0,1 0,12 0a6,9.5 0,1 0,-12 0z"/>
              <path android:fillColor="#FFFFFF" android:strokeColor="#1D4ED8" android:strokeWidth="2.8" android:pathData="M59,46a6,9.5 0,1 0,12 0a6,9.5 0,1 0,-12 0z"/>
              <path android:fillColor="#090D16" android:pathData="M40.2,46a2.8,5.8 0,1 0,5.6 0a2.8,5.8 0,1 0,-5.6 0z"/>
              <path android:fillColor="#090D16" android:pathData="M62.2,46a2.8,5.8 0,1 0,5.6 0a2.8,5.8 0,1 0,-5.6 0z"/>
              <!-- Улыбка -->
              <path android:fillColor="#FFFFFF" android:strokeColor="#DC2626" android:strokeWidth="4.2" android:strokeLineJoin="round" android:pathData="M36,63 Q54,73 72,63 Q67,79 54,79 Q41,79 36,63 Z"/>
              <!-- Красный нос -->
              <path android:fillColor="#EF4444" android:pathData="M54,54m-5.8,0a5.8,5.8 0,1 1,11.6 0a5.8,5.8 0,1 1,-11.6 0"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">MVZ</string>
              <string name="title_activity_main">MVZ</string>
              <string name="package_name">com.mvzvpn.app</string>
              <string name="custom_url_scheme">com.mvzvpn.app</string>
          </resources>
          EOF

      - name: Скачивание официального ядра Xray-core (arm64-v8a)
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          unzip -o xray.zip xray -d xray_bin
          cp xray_bin/xray android/app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod 755 android/app/src/main/jniLibs/arm64-v8a/libxray.so

      - name: Внедрение Android VpnService и моста Xray
        run: |
          mkdir -p android/app/src/main/java/com/mvzvpn/app

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_mvz_logo"
                  android:label="MVZ"
                  android:roundIcon="@drawable/ic_mvz_logo"
                  android:supportsRtl="true"
                  android:extractNativeLibs="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="com.mvzvpn.app.MainActivity"
                      android:label="MVZ"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name="com.mvzvpn.app.AetherVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > android/app/src/main/java/com/mvzvpn/app/AetherVpnService.java
          package com.mvzvpn.app;

          import android.content.Intent;
          import android.net.ProxyInfo;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public class AetherVpnService extends VpnService {
              private ParcelFileDescriptor vpnInterface = null;
              private Process xrayProcess = null;
              public static volatile boolean isRunning = false;
              public static final List<String> logs = Collections.synchronizedList(new ArrayList<>());

              public static void addLog(String msg) {
                  synchronized (logs) {
                      if (logs.size() > 80) {
                          logs.remove(0);
                      }
                      logs.add(msg);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "STOP".equals(intent.getAction())) {
                      stopVpn();
                      return START_NOT_STICKY;
                  }
                  String configJson = intent != null ? intent.getStringExtra("configJson") : null;
                  if (configJson != null) {
                      startVpn(configJson);
                  }
                  return START_STICKY;
              }

              private void startVpn(String configJson) {
                  stopVpnInternal();
                  logs.clear();
                  try {
                      File configFile = new File(getFilesDir(), "xray_config.json");
                      try (FileOutputStream fos = new FileOutputStream(configFile, false)) {
                          fos.write(configJson.getBytes(StandardCharsets.UTF_8));
                      }

                      String xrayPath = getApplicationInfo().nativeLibraryDir + "/libxray.so";
                      File xrayBin = new File(xrayPath);
                      xrayBin.setExecutable(true);

                      addLog("[MVZ-CORE] Запуск Xray: " + xrayPath);
                      ProcessBuilder pb = new ProcessBuilder(xrayPath, "run", "-c", configFile.getAbsolutePath());
                      pb.directory(getFilesDir());
                      pb.redirectErrorStream(true);
                      xrayProcess = pb.start();

                      new Thread(() -> {
                          try (BufferedReader reader = new BufferedReader(
                                  new InputStreamReader(xrayProcess.getInputStream(), StandardCharsets.UTF_8))) {
                              String line;
                              while ((line = reader.readLine()) != null) {
                                  addLog(line);
                              }
                          } catch (Exception e) {
                              addLog("[CORE-END] " + e.getMessage());
                          }
                      }).start();

                      Builder builder = new Builder();
                      builder.setSession("MVZ VPN (Xray-core)");
                      builder.setMtu(1500);
                      builder.addAddress("10.10.0.1", 32);
                      builder.addDnsServer("1.1.1.1");
                      builder.addDnsServer("8.8.8.8");

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          builder.setHttpProxy(ProxyInfo.buildDirectProxy("127.0.0.1", 10809));
                      }

                      vpnInterface = builder.establish();
                      isRunning = true;
                      addLog("[MVZ-TUN] Туннель активен (SOCKS5 127.0.0.1:10808 | HTTP 127.0.0.1:10809)");
                  } catch (Exception e) {
                      addLog("[ERROR] Ошибка запуска: " + e.getMessage());
                      isRunning = false;
                  }
              }

              private void stopVpnInternal() {
                  isRunning = false;
                  if (xrayProcess != null) {
                      try {
                          xrayProcess.destroyForcibly();
                      } catch (Exception ignored) {}
                      xrayProcess = null;
                  }
                  if (vpnInterface != null) {
                      try {
                          vpnInterface.close();
                      } catch (Exception ignored) {}
                      vpnInterface = null;
                  }
              }

              private void stopVpn() {
                  addLog("[STOP] Остановка MVZ Xray-core...");
                  stopVpnInternal();
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  stopVpnInternal();
                  super.onDestroy();
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/mvzvpn/app/MainActivity.java
          package com.mvzvpn.app;

          import android.content.Intent;
          import android.net.TrafficStats;
          import android.net.VpnService;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;

          import com.getcapacitor.BridgeActivity;

          import java.net.InetSocketAddress;
          import java.net.Socket;

          public class MainActivity extends BridgeActivity {
              private static final int VPN_REQUEST_CODE = 1901;
              private String pendingConfigJson = null;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().addJavascriptInterface(new XrayBridge(), "AndroidXray");
                  }
              }

              private void launchVpnService(String configJson) {
                  Intent serviceIntent = new Intent(this, AetherVpnService.class);
                  serviceIntent.putExtra("configJson", configJson);
                  startService(serviceIntent);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == VPN_REQUEST_CODE) {
                      if (resultCode == RESULT_OK && pendingConfigJson != null) {
                          launchVpnService(pendingConfigJson);
                      } else {
                          AetherVpnService.addLog("[WARN] Разрешение на VPN отклонено");
                      }
                  }
              }

              public class XrayBridge {
                  @JavascriptInterface
                  public String startXray(String configJson) {
                      pendingConfigJson = configJson;
                      Intent prepareIntent = VpnService.prepare(MainActivity.this);
                      if (prepareIntent != null) {
                          startActivityForResult(prepareIntent, VPN_REQUEST_CODE);
                          return "PERMISSION_REQUESTED";
                      } else {
                          launchVpnService(configJson);
                          return "STARTED";
                      }
                  }

                  @JavascriptInterface
                  public void stopXray() {
                      Intent serviceIntent = new Intent(MainActivity.this, AetherVpnService.class);
                      serviceIntent.setAction("STOP");
                      startService(serviceIntent);
                  }

                  @JavascriptInterface
                  public boolean isRunning() {
                      return AetherVpnService.isRunning;
                  }

                  @JavascriptInterface
                  public String getLogs() {
                      synchronized (AetherVpnService.logs) {
                          StringBuilder sb = new StringBuilder();
                          for (String line : AetherVpnService.logs) {
                              sb.append(line).append("\n");
                          }
                          return sb.toString();
                      }
                  }

                  @JavascriptInterface
                  public int pingHost(String host, int port) {
                      long start = System.currentTimeMillis();
                      try (Socket socket = new Socket()) {
                          socket.connect(new InetSocketAddress(host, port), 2500);
                          return (int) (System.currentTimeMillis() - start);
                      } catch (Exception e) {
                          return -1;
                      }
                  }

                  @JavascriptInterface
                  public String getTrafficBytes() {
                      long rx = TrafficStats.getTotalRxBytes();
                      long tx = TrafficStats.getTotalTxBytes();
                      return rx + ":" + tx;
                  }
              }
          }
          EOF

      - name: Компиляция APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: MVZ-VPN-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
