name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание файлов репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установка Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Подготовка проекта и Capacitor
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            echo "ОШИБКА: Файл index.html не найден в корне репозитория!"
            exit 1
          fi

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.aethervpn.app",
            "appName": "AetherVPN",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Компиляция APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherVPN-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
